<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b4f8a">
<title>4 Esquinas – Alumno</title>
<style>
:root{--bg:#1b4f8a;--ink:#13233a;--sun:#f6b40e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;line-height:1.35}
.screen{display:none;padding:16px;max-width:560px;margin:0 auto}
.screen.on{display:block}
h1{font-size:1.6rem;margin:8px 0}
.sub{color:#cfe0f3}
.panel{background:#ffffff18;border-radius:16px;padding:14px;margin:14px 0}
label{display:block;font-weight:700;margin:12px 0 4px}
input{font:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:0;width:100%}
#codigo{text-transform:uppercase;letter-spacing:.2em;font-weight:800}
.btn{border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;background:var(--sun);color:var(--ink);width:100%;margin-top:14px}
.err{color:#ffb3b5;margin-top:8px;min-height:1.2em}
#frase{font-size:1.3rem;font-weight:800;margin:10px 0 14px}
.opts{display:grid;gap:10px}
.opt{border:0;border-radius:16px;padding:16px;font:inherit;text-align:left;color:var(--ink);cursor:pointer;opacity:.9;border:4px solid transparent}
.opt b{display:block;font-size:1.15rem}
.opt small{display:block;margin-top:2px}
.opt.sel{opacity:1;border-color:#fff;box-shadow:0 0 0 3px var(--ink) inset}
.opt:disabled{cursor:default}
.opts.cerrada .opt:not(.sel){opacity:.35}
#estado{margin-top:12px;font-weight:700;text-align:center}
.wait{text-align:center;padding-top:40px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--sun);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2}}
</style>
</head>
<body>

<section class="screen on" id="login">
  <h1>Juego de las 4 Esquinas</h1>
  <p class="sub">Mitos y Realidades sobre las Adicciones</p>
  <div class="panel">
    <label for="codigo">Código de sala</label>
    <input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters">
    <label for="nombre">Tu nombre y apellido</label>
    <input id="nombre" maxlength="40" autocomplete="name">
    <button class="btn" id="btnEntrar" onclick="entrar()">Entrar</button>
    <div class="err" id="err"></div>
  </div>
  <p class="sub" style="font-size:.9rem">No es un examen: es para pensar y debatir juntos. Elegir "No sé" también vale.</p>
</section>

<section class="screen" id="espera">
  <div class="wait">
    <h1 id="hola"></h1>
    <p><span class="dot"></span> <span id="msgEspera">Esperando que el/la docente empiece…</span></p>
  </div>
</section>

<section class="screen" id="votar">
  <p class="sub" id="pos"></p>
  <div id="frase"></div>
  <div class="opts" id="opts"></div>
  <div id="estado"></div>
</section>

<script src="contenido.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const $ = id => document.getElementById(id);
const A = window.AFIRMACIONES, E = window.ESQUINAS;
let db, salaRef, uid, idx = -1, abierta = false, miVoto = null, votoRef = null;

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

const params = new URLSearchParams(location.search);
if (params.get('sala')) $('codigo').value = params.get('sala').toUpperCase();
try { $('nombre').value = localStorage.getItem('4e_nombre') || ''; } catch(e){}

if (!window.FIREBASE_CONFIG){ $('err').textContent = 'La sala en línea todavía no está configurada. Avisale a tu docente.'; $('btnEntrar').disabled = true; }
else { firebase.initializeApp(window.FIREBASE_CONFIG); db = firebase.database(); }

$('opts').innerHTML = E.map((e,i) => `<button class="opt" data-id="${e.id}" style="background:${e.color}"><b>${i+1}. ${e.nombre}</b><small>${e.desc}</small></button>`).join('');
$('opts').onclick = ev => { const b = ev.target.closest('.opt'); if (b) votar(b.dataset.id); };

async function entrar(){
  const sala = $('codigo').value.trim().toUpperCase(), nombre = $('nombre').value.trim().replace(/\s+/g,' ');
  $('err').textContent = '';
  if (sala.length !== 4){ $('err').textContent = 'El código tiene 4 caracteres.'; return; }
  if (nombre.length < 2){ $('err').textContent = 'Escribí tu nombre.'; return; }
  $('btnEntrar').disabled = true;
  try {
    salaRef = db.ref('salas/' + sala);
    if (!(await salaRef.child('creada').get()).exists()){ $('err').textContent = 'No existe esa sala. Revisá el código.'; $('btnEntrar').disabled = false; return; }
    const key = '4e_uid_' + sala;
    try { uid = localStorage.getItem(key); } catch(e){}
    if (!uid){ uid = salaRef.child('alumnos').push().key; try { localStorage.setItem(key, uid); } catch(e){} }
    try { localStorage.setItem('4e_nombre', nombre); } catch(e){}
    await salaRef.child('alumnos/' + uid).set({ nombre, t: firebase.database.ServerValue.TIMESTAMP });
  } catch(e){ $('err').textContent = 'No se pudo conectar. Probá de nuevo.'; $('btnEntrar').disabled = false; return; }
  $('hola').textContent = '¡Hola, ' + nombre + '!';
  show('espera');
  salaRef.child('estado').on('value', s => cambiarEstado(s.val() || { idx: -1 }));
}

function cambiarEstado(st){
  abierta = !!st.abierta;
  if (st.idx === -2){ $('msgEspera').textContent = 'Terminó el juego. ¡Gracias por participar!'; show('espera'); return; }
  if (st.idx == null || st.idx < 0 || !A[st.idx]){ show('espera'); return; }
  if (st.idx !== idx){
    idx = st.idx; miVoto = null;
    if (votoRef) votoRef.off();
    votoRef = salaRef.child('votos/' + idx + '/' + uid);
    votoRef.on('value', s => { miVoto = s.val(); pintar(); });
    $('pos').textContent = st.n ? `Frase ${st.n} de ${st.total}` : '';
    $('frase').textContent = '"' + A[idx].texto + '"';
  }
  show('votar'); pintar();
}

function votar(id){
  if (!abierta) return;
  miVoto = id; pintar();
  salaRef.child('votos/' + idx + '/' + uid).set(id);
}

function pintar(){
  document.querySelectorAll('.opt').forEach(b => { b.classList.toggle('sel', b.dataset.id === miVoto); b.disabled = !abierta; });
  $('opts').classList.toggle('cerrada', !abierta);
  const e = E.find(x => x.id === miVoto);
  $('estado').textContent = abierta
    ? (e ? `Elegiste: ${e.corto}. Podés cambiar hasta que se cierre la votación.` : 'Elegí la esquina que mejor representa tu opinión.')
    : (e ? `Votación cerrada. Elegiste: ${e.corto}.` : 'Votación cerrada.');
}
</script>
</body>
</html>
